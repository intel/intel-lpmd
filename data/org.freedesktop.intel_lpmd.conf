<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

        <policy user="root">
                <allow own="org.freedesktop.intel_lpmd"/>
                <allow send_destination="org.freedesktop.intel_lpmd"/>
                <allow receive_sender="org.freedesktop.intel_lpmd"/>
        </policy>

        <!-- Only allow members of the power group to communicate
             with the daemon -->
        <policy context="default">
                <deny send_destination="org.freedesktop.intel_lpmd"/>
                <allow receive_sender="org.freedesktop.intel_lpmd"/>

                <!-- Allow any user-session helper to publish the
                     currently focused window's PID. This is the
                     only method that needs to be reachable from
                     non-root processes (e.g. intel_lpmd_focus_helper
                     running under the desktop session). -->
                <allow send_destination="org.freedesktop.intel_lpmd"
                       send_interface="org.freedesktop.intel_lpmd"
                       send_member="LPM_SET_FOCUS_PID"/>
                <allow send_destination="org.freedesktop.intel_lpmd"
                       send_interface="org.freedesktop.intel_lpmd"
                       send_member="LPM_FOCUS_HELPER_READY"/>
        </policy>

</busconfig>
